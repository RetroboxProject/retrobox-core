name: Build packages

# Builds retrobox-core_<version>_all.deb, retrobox-core-<version>-1.noarch.rpm and
# retrobox-core-all.tar.gz (the payload of install.sh) and smoke-tests them
# on Ubuntu 24.04, Debian 13 and Fedora. Releases are manual: run this
# workflow with a version (see release-dispatch) to publish them (plus
# install.sh and SHA256SUMS) as a GitHub Release.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to publish (e.g. v0.2.2). Empty = build only.'
        required: false
        type: string
        default: ''
      prerelease:
        description: 'Mark the release as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-deb-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out (full history, for version detection)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Tag the build with the requested version
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Invalid version: ${VERSION}" >&2
            exit 1
          fi
          git tag "${VERSION}"

      - name: Build the .deb
        run: packaging/deb/build-deb.sh --outdir dist

      - name: Build the .rpm
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm
          packaging/rpm/build-rpm.sh --outdir dist

      - name: Build the install.sh tarball
        run: packaging/tarball/build-tarball.sh --outdir dist

      - name: Copy install.sh next to it
        run: cp install.sh dist/install.sh

      - name: Generate SHA256SUMS for every release asset
        run: |
          cd dist
          rm -f SHA256SUMS
          sha256sum *.deb *.rpm retrobox-core-all.tar.gz install.sh > SHA256SUMS
          cat SHA256SUMS

      - name: Show package contents
        run: |
          for deb in dist/*.deb; do
            dpkg-deb --info "$deb"
            dpkg-deb --contents "$deb" | head -60
            ls -lh "$deb"
          done

      - name: Upload the packages
        uses: actions/upload-artifact@v4
        with:
          name: retrobox-dist
          path: |
            dist/*.deb
            dist/*.rpm
            dist/retrobox-core-all.tar.gz
            dist/SHA256SUMS
            dist/install.sh
          if-no-files-found: error

  smoke-test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "debian:trixie"]
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    steps:
      - name: Check out (for the test script only)
        uses: actions/checkout@v4
        with:
          sparse-checkout: packaging/deb/smoke-test.sh
          sparse-checkout-cone-mode: false

      - name: Download the packages
        uses: actions/download-artifact@v4
        with:
          name: retrobox-dist
          path: dist

      - name: Install, run and purge the .deb
        run: bash packaging/deb/smoke-test.sh dist/*.deb

  smoke-test-rpm:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        image: ["fedora:latest", "fedora:42"]
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    steps:
      - name: Install git (for the sparse checkout)
        run: dnf install -y -q git

      - name: Check out (for the test script only)
        uses: actions/checkout@v4
        with:
          sparse-checkout: packaging/rpm/smoke-test.sh
          sparse-checkout-cone-mode: false

      - name: Download the packages
        uses: actions/download-artifact@v4
        with:
          name: retrobox-dist
          path: dist

      - name: Install, run and remove the .rpm
        run: bash packaging/rpm/smoke-test.sh dist/*.rpm

  install-test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "debian:trixie", "fedora:latest"]
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    steps:
      - name: Download the packages
        uses: actions/download-artifact@v4
        with:
          name: retrobox-dist
          path: dist

      - name: Run install.sh from the tarball, then uninstall
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update -qq
            apt-get install -y -qq curl ca-certificates
          else
            dnf install -y -q curl
          fi
          bash dist/install.sh --tarball dist/retrobox-core-all.tar.gz
          test "$(retrobox --version)" != ""
          test -f /opt/retrobox/bin/retrobox
          test -f /etc/retrobox/retrobox.ini
          test -f /usr/local/share/applications/retrobox.desktop
          grep -qx 'Exec=/usr/local/bin/retrobox' /usr/local/share/applications/retrobox.desktop
          test -s /usr/local/share/icons/hicolor/48x48/apps/retrobox.png
          test -s /usr/local/share/icons/hicolor/512x512/apps/retrobox.png
          bash dist/install.sh --uninstall
          test ! -e /opt/retrobox
          test ! -e /usr/local/share/applications/retrobox.desktop
          test ! -e /usr/local/share/icons/hicolor/48x48/apps/retrobox.png

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.version != ''
    needs: [build, smoke-test, smoke-test-rpm, install-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download the packages
        uses: actions/download-artifact@v4
        with:
          name: retrobox-dist
          path: dist

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          flags=()
          if [[ "${PRERELEASE}" == "true" ]]; then
            flags+=(--prerelease)
          fi
          if gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/* --repo "${REPO}" --clobber
          else
            gh release create "${TAG}" dist/* --repo "${REPO}" \
              --target "${SHA}" --title "${TAG}" --generate-notes "${flags[@]}"
          fi
