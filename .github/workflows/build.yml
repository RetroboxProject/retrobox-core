name: Build packages

# Builds retrobox-core_<version>_all.deb, retrobox-core-<version>-1.noarch.rpm and
# retrobox-core-all.tar.gz (the payload of install.sh), smoke-tests them
# on Ubuntu 24.04, Debian 13 and Fedora, and,
# for tags like v1.2.3, publishes them (plus install.sh and SHA256SUMS) as a
# GitHub Release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-deb-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out (full history, for version detection)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Build the .deb
        run: packaging/deb/build-deb.sh --outdir dist

      - name: Build the .rpm
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm
          packaging/rpm/build-rpm.sh --outdir dist

      - name: Build the install.sh tarball
        run: packaging/tarball/build-tarball.sh --outdir dist

      - name: Copy install.sh next to it
        run: cp install.sh dist/install.sh

      - name: Show package contents
        run: |
          for deb in dist/*.deb; do
            dpkg-deb --info "$deb"
            dpkg-deb --contents "$deb" | head -60
            ls -lh "$deb"
          done

      - name: Upload the packages
        uses: actions/upload-artifact@v4
        with:
          name: retrobox-dist
          path: |
            dist/*.deb
            dist/*.rpm
            dist/retrobox-core-all.tar.gz
            dist/SHA256SUMS
            dist/install.sh
          if-no-files-found: error

  smoke-test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "debian:trixie"]
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    steps:
      - name: Check out (for the test script only)
        uses: actions/checkout@v4
        with:
          sparse-checkout: packaging/deb/smoke-test.sh
          sparse-checkout-cone-mode: false

      - name: Download the packages
        uses: actions/download-artifact@v4
        with:
          name: retrobox-dist
          path: dist

      - name: Install, run and purge the .deb
        run: bash packaging/deb/smoke-test.sh dist/*.deb

  smoke-test-rpm:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        image: ["fedora:latest", "fedora:42"]
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    steps:
      - name: Install git (for the sparse checkout)
        run: dnf install -y -q git

      - name: Check out (for the test script only)
        uses: actions/checkout@v4
        with:
          sparse-checkout: packaging/rpm/smoke-test.sh
          sparse-checkout-cone-mode: false

      - name: Download the packages
        uses: actions/download-artifact@v4
        with:
          name: retrobox-dist
          path: dist

      - name: Install, run and remove the .rpm
        run: bash packaging/rpm/smoke-test.sh dist/*.rpm

  install-test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "debian:trixie", "fedora:latest"]
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    steps:
      - name: Download the packages
        uses: actions/download-artifact@v4
        with:
          name: retrobox-dist
          path: dist

      - name: Run install.sh from the tarball, then uninstall
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update -qq
            apt-get install -y -qq curl ca-certificates
          else
            dnf install -y -q curl
          fi
          bash dist/install.sh --tarball dist/retrobox-core-all.tar.gz
          test "$(retrobox --version)" != ""
          test -f /opt/retrobox/bin/retrobox
          test -f /etc/retrobox/retrobox.ini
          bash dist/install.sh --uninstall
          test ! -e /opt/retrobox

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, smoke-test, smoke-test-rpm, install-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download the packages
        uses: actions/download-artifact@v4
        with:
          name: retrobox-dist
          path: dist

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$REPO" --clobber
          else
            gh release create "$TAG" dist/* --repo "$REPO" --title "$TAG" --generate-notes
          fi
