emulator_name: ares
core_name: psx
groups:
  GENERAL:
    submenus:
      EMULATION:
        - name: FAST BOOT
          value: ares_fast_boot
          description: Skip the boot animation of the console. Ares only applies it to the PlayStation, the Game Boy, the Game Boy Color and the Neo Geo Pocket.
          choices:
            - name: Disabled (Default)
              value: false
            - name: Enabled
              value: true
  CONTROLS:
    submenus:
      GAMEPAD:
        - name: CONTROLLER TYPE
          value: ares_psx_pad
          description: The DualShock has analog sticks and rumble. The digital gamepad has neither.
          choices:
            - name: DualShock (Default)
              value: DualShock
            - name: Digital gamepad
              value: Digital Gamepad
