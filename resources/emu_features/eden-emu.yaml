emulator_name: "eden-emu"
features:
  - padtokeyboard
sharedFeatures:
  - videomode
  - hud
  - hud_corner
  - discordrpc
  - power_profile
  - tdp
groups:
  GENERAL:
    submenus:
      SCREEN:
        - name: ASPECT RATIO
          value: eden_ratio
          description: "Yuzu Aspect Ratio Auto=16/9"
          choices:
            - name: 16/9
              value: 0
            - name: Force 4/3
              value: 1
            - name: Force 21/9
              value: 2
            - name: Force 16/10
              value: 3
            - name: Stretch To Window
              value: 4
        - name: VSYNC
          value: vsync
          description: "Fix the heavy screen tearing in games Auto=Mailbox (Recommended)"
          choices:
            - name: Mailbox (Recommended)
              value: 1
            - name: Off (Immediate)
              value: 0
            - name: On (Fifo)
              value: 2
            - name: Fifo relaxed
              value: 3
        - name: GRAPHICS API
          value: gfxbackend
          description: Choose which graphics API library to use
          choices:
            - name: Opengl
              value: 0
            - name: Vulkan
              value: 1
        - name: RENDERING RESOLUTION
          value: resolution_scale
          description: "Improve the fidelity of 3D models Auto=1X (720p/1080p)"
          choices:
            - name: "0.25x (180p/270p)[experimental]"
              value: 0
            - name: "0.50x (360p/540p)[experimental]"
              value: 1
            - name: "0.75x (540p/810p)[experimental]"
              value: 2
            - name: 1x (720p/1080p)
              value: 3
            - name: 1.25x (900p/1350p)
              value: 4
            - name: "1.5x (1080/1620p)[experimental]"
              value: 5
            - name: 2x (1440p/2160p)
              value: 6
            - name: 3x (2160p/3240p)
              value: 7
            - name: 4x (2880p/4320p)
              value: 8
            - name: 5x (3600p/5400p)
              value: 9
            - name: 6x (4320p/6480p)
              value: 10
            - name: 7x (5040p/7560p)
              value: 11
            - name: 8x (5760p/8640p)
              value: 12
        - name: SCALING FILTER
          value: scale_filter
          description: "Smooths out textures on 3D objetcs Auto=Bilinear"
          choices:
            - name: "Nearest-Neighbor"
              value: 0
            - name: Bilinear
              value: 1
            - name: Bicubic
              value: 2
            - name: Gaussian
              value: 3
            - name: Lanczos
              value: 4
            - name: ScaleForce
              value: 5
            - name: "AMD's FidelityFX Super Resolution [Vulkan Only]"
              value: 6
            - name: Area
              value: 7
            - name: "Zero-Tangent"
              value: 8
            - name: "B-Spline"
              value: 9
            - name: Mitchell
              value: 10
            - name: "Spline-1"
              value: 11
            - name: MMPX
              value: 12
      EMULATION:
        - name: SWITCH DOCK MODE
          value: dock_mode
          description: "Undocked reduce resolution/detail for slow PC Auto=Docked"
          choices:
            - name: Docked
              value: 1
            - name: Undocked
              value: 0
  CONTROLS:
    submenus:
      CONTROLLERS:
        - name: AUTO CONTROLLER CONFIG
          value: eden_auto_controller_config
          description: "Auto Controller Configuration Auto=On "
          choices:
            - name: Off
              value: 0
            - name: On
              value: 1
        - name: RUMBLE
          value: eden_rumble
          description: "Controller Rumble Auto=On "
          choices:
            - name: Off
              value: false
            - name: On
              value: true
        - name: "INVERSE BUTTON A/X - X/Y"
          value: eden_inverse_button
          description: Inverse Button A/X and X/Y For Xbox
          choices:
            - name: Off
              value: false
            - name: On
              value: true
      PORT 1:
        - name: CONTROLLER 1 TYPE
          value: p1_pad
          description: "Choose Player 1 Pad Type Auto=Pro Controller"
          choices:
            - name: Pro Controller
              value: 0
            - name: Two Joycons
              value: 1
            - name: Left joycon
              value: 2
            - name: Right Joycon
              value: 3
            - name: Portable Mode
              value: 4
            - name: Gamecube Pad
              value: 5
