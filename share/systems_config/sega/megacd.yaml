megacd:
  fullname: Mega CD
  manufacturer: Sega
  release: 1991
  hardware: console
  # an optical drive: the overlay offers the tray (and the discs of an .m3u)
  disc_drive: true
  extension:
  - .cue
  - .iso
  - .chd
  - .m3u
  platform:
  - megacd
  theme: megacd
  emulators:
    libretro:
      cores:
        genesis_plus_gx:
          default: true
        picodrive: {}
    ares:
      cores:
        megadrive:
          incompatible_extensions:
          - .iso
          - .m3u
