zxspectrum:
  fullname: ZX Spectrum
  manufacturer: Sinclair
  release: 1982
  hardware: computer
  extension:
  - .tzx
  - .tap
  - .z80
  - .rzx
  - .scl
  - .trd
  - .dsk
  - .zip
  - .7z
  platform:
  - zxspectrum
  theme: zxspectrum
  emulators:
    libretro:
      cores:
        fuse:
          default: true
    ares:
      cores:
        zxspectrum:
          incompatible_extensions:
          - .z80
          - .rzx
          - .scl
          - .trd
          - .dsk
          - .7z
