pcenginecd:
  fullname: PC Engine CD
  manufacturer: NEC
  release: 1988
  hardware: console
  # an optical drive: the overlay offers the tray (and the discs of an .m3u)
  disc_drive: true
  extension:
  - .pce
  - .cue
  - .ccd
  - .iso
  - .img
  - .chd
  platform:
  - pcenginecd
  theme: pce-cd
  emulators:
    libretro:
      cores:
        pce:
          default: true
        pce_fast: {}
    ares:
      cores:
        pcengine:
          incompatible_extensions:
          - .pce
          - .ccd
          - .iso
          - .img
