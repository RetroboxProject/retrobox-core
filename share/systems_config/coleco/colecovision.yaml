colecovision:
  fullname: ColecoVision
  manufacturer: Coleco
  release: 1982
  hardware: console
  extension:
  - .bin
  - .col
  - .rom
  - .zip
  - .7z
  platform:
  - colecovision
  theme: colecovision
  emulators:
    libretro:
      cores:
        bluemsx:
          default: true
    ares:
      cores:
        colecovision:
          incompatible_extensions:
          - .bin
          - .rom
          - .7z
