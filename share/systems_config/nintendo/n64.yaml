n64:
  fullname: Nintendo 64
  manufacturer: Nintendo
  release: 1996
  hardware: console
  extension:
  - .z64
  - .n64
  - .v64
  - .zip
  - .7z
  platform:
  - n64
  theme: n64
  emulators:
    libretro:
      cores:
        mupen64plus_next: {}
        parallel_n64: {}
    mupen64plus:
      cores:
        glide64mk2:
          incompatible_extensions:
          - .zip
          - .7z
        gliden64:
          incompatible_extensions:
          - .zip
          - .7z
        rice:
          incompatible_extensions:
          - .zip
          - .7z
    ares:
      cores:
        n64:
          default: true