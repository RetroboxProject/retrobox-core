fmtowns:
  fullname: FM-TOWNS
  manufacturer: Fujitsu
  release: 1987
  hardware: computer
  # an optical drive: the overlay offers the tray (and the discs of an .m3u)
  disc_drive: true
  extension:
  - .bin
  - .m3u
  - .cue
  - .d88
  - .d77
  - .xdf
  - .iso
  - .chd
  - .toc
  - .nrg
  - .gdi
  - .cdr
  - .mfi
  - .dfi
  - .hfe
  - .mfm
  - .td0
  - .imd
  - .1dd
  - .cqm
  - .cqi
  - .dsk
  - .zip
  - .7z
  platform:
  - fmtowns
  theme: fmtowns
  emulators:
    libretro:
      cores:
        mame:
          incompatible_extensions:
          - .xdf
          - .m3u
          default: true
    mame:
      cores:
        mame:
          incompatible_extensions:
          - .xdf
          - .m3u
