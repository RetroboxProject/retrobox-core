ps3:
  fullname: PlayStation 3
  manufacturer: Sony
  release: 2006
  hardware: console
  # an optical drive: the overlay offers the tray (and the discs of an .m3u)
  disc_drive: true
  extension:
  - .ps3
  - .psn
  - .iso
  - .squashfs
  - .pkg
  platform:
  - ps3
  theme: ps3
  emulators:
    rpcs3:
      cores:
        rpcs3:
          default: true
          options:
            force_no_bezel: true