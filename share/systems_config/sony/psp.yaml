psp:
  fullname: PlayStation Portable
  manufacturer: Sony
  release: 2004
  hardware: portable
  # an optical drive: the overlay offers the tray (and the discs of an .m3u)
  disc_drive: true
  extension:
  - .iso
  - .cso
  - .pbp
  - .chd
  platform:
  - psp
  theme: psp
  emulators:
    libretro:
      cores:
        ppsspp: {}
    ppsspp:
      cores:
        ppsspp:
          default: true
          options:
            force_no_bezel: true