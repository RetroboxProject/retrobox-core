emulator_name: ares
sharedFeatures:
  - power_profile
  - tdp
  - videomode
  - bezel
  - bezel_stretch
  - hud
  - hud_corner
  - hud_custom
  - bezel.tattoo
  - bezel.tattoo_corner
  - bezel.tattoo_file
  - bezel.resize_tattoo
  - shaderset
groups:
  GENERAL:
    submenus:
      SCREEN:
        - name: VSYNC
          value: use_vsync
          description: Fix screen tearing. May bring latency
          choices:
            - name: Disabled
              value: 0
            - name: Enabled
              value: 1
        - name: SCALING MODE
          value: ares_output
          description: 'How the picture fills the window: best fit, whole multiples of its size, or stretched to the window.'
          choices:
            - name: Best fit (Default)
              value: Scale
            - name: Integer scaling
              value: Integer
            - name: Stretch
              value: Stretch
        - name: ASPECT CORRECTION
          value: ares_aspect_correction
          description: Corrects the shape of the pixels of the original hardware.
          choices:
            - name: Standard (Default)
              value: Standard
            - name: None
              value: None
            - name: Anamorphic (widescreen)
              value: Anamorphic
      AUDIO:
        - name: AUDIO LATENCY
          value: ares_audio_latency
          description: Adjust audio buffer latency in milliseconds.
          choices:
            - name: "20 ms"
              value: 20
            - name: "40 ms (Default)"
              value: 40
            - name: "80 ms"
              value: 80
      EMULATION:
        - name: REGION
          value: ares_region
          description: Region of the console. Used by the games that support several, and to pick the BIOS of that region.
          choices:
            - name: USA (Default)
              value: NTSC-U
            - name: Japan
              value: NTSC-J
            - name: Europe
              value: PAL
