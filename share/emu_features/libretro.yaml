emulator_name: libretro
# cores that can host or join a netplay room (EmulationStation shows netplay
# only for these). Same set as batocera, with retrobox's core names.
netplay_cores:
  - "81"
  - mednafen_lynx
  - mednafen_ngp
  - pce
  - pce_fast
  - mednafen_pce
  - mednafen_pce_fast
  - pcfx
