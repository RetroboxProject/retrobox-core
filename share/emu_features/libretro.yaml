groups:
  GENERAL:
    submenus:
      SCREEN:
        - name: GRAPHICS API
          value: gfxbackend
          description: >-
            Video driver. Default uses the best one for the core (Vulkan, or OpenGL Core / OpenGL for the cores that need it). If the chosen driver is not available, the next one is used (Vulkan, then OpenGL Core, then OpenGL). Shader sets need Vulkan or OpenGL Core.
          choices:
            - name: Default
              value: auto
            - name: Vulkan
              value: vulkan
            - name: OpenGL Core
              value: glcore
            - name: OpenGL (legacy)
              value: gl
        - name: GAME ASPECT RATIO
          value: ratio
          description: Force the game to render in this aspect ratio. Not all systems support all ratios.
          choices:
            - name: 4/3
              value: 4/3
            - name: 16/9
              value: 16/9
            - name: Full
              value: full
            - name: 16/10
              value: 16/10
            - name: 16/15
              value: 16/15
            - name: 21/9
              value: 21/9
            - name: 1/1
              value: 1/1
            - name: 2/1
              value: 2/1
