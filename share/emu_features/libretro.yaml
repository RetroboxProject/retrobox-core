  - tdp
  - shaderset
  - smooth
  - integerscale
  - bezel
  - bezel_stretch
  - hud
  - hud_corner
  - hud_custom
  - bezel.tattoo
  - bezel.tattoo_corner
  - bezel.tattoo_file
  - bezel.resize_tattoo
  - ai_service_enabled
  - ai_target_lang
  - ai_service_url
  - ai_service_pause
  - audio_volume
  - discordrpc
groups:
  GENERAL:
    submenus:
      SCREEN:
        - name: GRAPHICS API
          value: gfxbackend
          description: >-
            Video driver. Default uses the best one for the core (Vulkan, or OpenGL Core / OpenGL for the cores that need it). If the chosen driver is not available, the next one is used (Vulkan, then OpenGL Core, then OpenGL). Shader sets need Vulkan or OpenGL Core.
          choices:
            - name: Default
              value: auto
            - name: Vulkan
              value: vulkan
            - name: OpenGL Core
              value: glcore
            - name: OpenGL (legacy)
              value: gl
        - name: GAME ASPECT RATIO
          value: ratio
          description: Force the game to render in this aspect ratio. Not all systems support all ratios.
          choices:
            - name: 4/3
              value: 4/3
            - name: 16/9
              value: 16/9
            - name: Full
              value: full
            - name: 16/10
              value: 16/10
            - name: 16/15
              value: 16/15
            - name: 21/9
              value: 21/9
            - name: 1/1
              value: 1/1
            - name: 2/1
              value: 2/1
            - name: 3/2
              value: 3/2
            - name: 3/4
              value: 3/4
            - name: 4/1
              value: 4/1
            - name: 9/16
              value: 9/16
            - name: 5/4
              value: 5/4
            - name: 6/5
              value: 6/5
            - name: 7/9
              value: 7/9
            - name: 8/3
              value: 8/3
            - name: 8/7
              value: 8/7
            - name: 19/12
              value: 19/12
            - name: 19/14
              value: 19/14
            - name: 30/17
              value: 30/17
            - name: 32/9
              value: 32/9
            - name: Config
              value: config
            - name: Square pixel
              value: squarepixel
            - name: Core provided
              value: core
            - name: Custom
              value: custom
  CONTROLS:
    submenus:
