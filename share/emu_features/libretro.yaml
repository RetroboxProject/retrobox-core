emulator_name: libretro
# cores that can earn RetroAchievements: EmulationStation gives them the
# "cheevos" feature, which is what makes it offer the achievements (the
# RETROACHIEVEMENTS entries, the game hashes) for their games and warn about the
# cores that cannot. RetroArch itself runs them in any core, so this list is only
# what the RetroAchievements project supports (docs.retroachievements.org,
# "Emulator Support and Issues"), left out on purpose: mame*, blastem, nestopia,
# quasi88, atari800 / a5200 (loading files from the menu bypasses the hashing),
# the cores that are not on that list, and the ones with only partial support.
# Add a core here, or in a file of the same name in the user's emu_features
# folder, to offer them for it too.
core_features:
  # cores that can host or join a netplay room (EmulationStation offers netplay
  # only for these). Same set as batocera, with retrobox's core names.
