emulator_name: "xenia-canary"
sharedFeatures:
  - power_profile
  - tdp
  - videomode
groups:
  GENERAL:
    submenus:
      SCREEN:
        - name: INTERNAL DISPLAY RESOLUTION
          value: xenia_resolution
          description: Allow game that support different resolutions to be rendered in specific resolution.
          choices:
            - name: 640x480
              value: 0
            - name: 640x576
              value: 1
            - name: 720x480
              value: 2
            - name: 720x576
              value: 3
            - name: 800x600
              value: 4
            - name: 848x480
              value: 5
            - name: 1024x768
              value: 6
            - name: 1152x864
              value: 7
            - name: 1280x720 (Default)
              value: 8
            - name: 1280x768
              value: 9
            - name: 1280x960
              value: 10
            - name: 1280x1024
              value: 11
            - name: 1360x768
              value: 12
            - name: 1440x900
              value: 13
            - name: 1680x1050
              value: 14
            - name: 1920x540
              value: 15
            - name: 1920x1080
              value: 16
        - name: GRAPHICS API
          value: xenia_api
          description: Choose which graphics API library to use. D3D12 may yield better results with faster GPUs.
          choices:
            - name: D3D12 (Default)
              value: D3D12
            - name: Native Vulkan
              value: Vulkan
        - name: VSYNC
          value: use_vsync
          description: Fix screen tearing. With Some games you need to turn VSync on in the games options.
          choices:
            - name: Disabled
              value: false
            - name: Enabled
              value: true
      EMULATION:
        - name: XBOX LIVE ARCADE
          value: xenia_license
          description: "This option enables the ability to play Xbox Live Arcade games. May cause compatibility issues with non-XBLA games."
          choices:
            - name: No licenses enabled
              value: 0
            - name: XBLA license enabled (Default)
              value: 1
            - name: All possible licenses (Not recommended)
              value: "-1"
        - name: SHOW ACHIEVEMENT MESSAGES
          value: xenia_achievement
          description: Choose to display achievement messages in the UI.
          choices:
            - name: Disabled
              value: false
            - name: Enabled
              value: true
        - name: CONSOLE COUNTRY
