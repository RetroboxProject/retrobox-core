emulator_name: pcsx2
core_name: pcsx2
sharedFeatures:
  - use_wheels
  - wheel_rotation
  - wheel_deadzone
  - wheel_midzone
  - autosave
groups:
  GENERAL:
    submenus:
      SCREEN:
        - name: GRAPHICS API
          value: pcsx2_gfxbackend
          description: Graphics API. The default is Vulkan, or OpenGL when Vulkan is not available on this system.
          choices:
            - name: Vulkan (Default)
              value: auto
            - name: Vulkan
              value: 14
            - name: OpenGL
              value: 12
            - name: Software
              value: 13
        - name: RENDERING RESOLUTION
          value: pcsx2_resolution
          description: Enhancement. Increase the rendering resolution. Makes 3D objects clearer.
          choices:
            - name: Native (PS2)(Default)
              value: 1
            - name: 1.25x Native
              value: 1.25
            - name: 1.5x Native
              value: 1.5
            - name: 1.75x Native
              value: 1.75
            - name: 2x Native (~720p)
              value: 2
            - name: 2.25x Native
              value: 2.25
            - name: 2.5x Native
              value: 2.5
            - name: 2.75x Native
              value: 2.75
            - name: 3x Native (~1080p)
              value: 3
            - name: 3.5x Native
              value: 3.5
            - name: 4x Native (~1440p/2K)
              value: 4
            - name: 5x Native (~1620p)
              value: 5
            - name: 6x Native (~2160p/4K)
              value: 6
            - name: 7x Native (~2520p)
              value: 7
            - name: 8x Native (~2880p/5K)
              value: 8
        - name: GAME ASPECT RATIO
          value: pcsx2_ratio
          description: Force the game to render in this aspect ratio. Not all systems support all ratios.
          choices:
            - name: Fit to Window / Fullscreen
              value: Stretch
            - name: "Auto Standard (4:3 interlaced / 3:2 progressive)"
              value: "Auto 4:3/3:2"
            - name: "Standard (4:3)"
              value: "4:3"
            - name: "Widescreen (16:9)"
              value: "16:9"
        - name: FMV ASPECT RATIO
          value: pcsx2_fmv_ratio
          description: Adjusts Full Motion Video movies aspect ratio.
          choices:
            - name: Off (Default)
              value: "Off"
            - name: "Auto Standard (4:3 interlaced / 3:2 progressive)"
              value: "Auto 4:3/3:2"
            - name: "Standard (4:3)"
              value: "4:3"
            - name: "Widescreen (16:9)"
              value: "16:9"
        - name: INTEGER SCALING
          value: pcsx2_scaling
          description: Can sharpen images in lower resolutions.
          choices:
            - name: Disabled
              value: false
            - name: Enabled
              value: true
      EMULATION:
        - name: FAST BOOT
          value: pcsx2_fastboot
          description: "Skip the PlayStation 2 BIOS logo and animation. Disable it for the few games that need to see it."
          choices:
            - name: Enabled (Default)
              value: true
            - name: Disabled
              value: false
        - name: BIOS
          value: pcsx2_forcebios
          description: The BIOS file the emulator starts the games with.
          order: 102
          choices:
            - name: EUR 230 (Default)
              value: auto
            - name: USA 120
              value: "ps2-0120a-20000902.bin"
            - name: JAP 101
              value: "ps2-0101j-20000217.bin"
            - name: EUR 120
              value: "ps2-0120e-20000902.bin"
            - name: USA 230
              value: "ps2-0230a-20080220.bin"
            - name: EUR 230
              value: "ps2-0230e-20080220.bin"
            - name: JAP 210j
              value: "ps2-0210j-20040917.bin"
            - name: PS3 PS2 FIRMWARE
              value: ps3_ps2_emu_bios.bin
  CONTROLS:
    submenus:
      CONTROLLERS:
        - name: MULTITAP
          value: pcsx2_multitap
          description: Allows up to 8 controllers in supported games.
          choices:
            - name: Maximum 2 Players (Default)
              value: 2
            - name: Maximum 4 Players
              value: 4
            - name: Maximum 8 Players
              value: 8
      WHEELS:
        - name: WHEEL MODEL
          value: pcsx2_wheel_type
          description: Playstation 2 wheel type
          choices:
            - name: Driving Force
              value: DrivingForce
            - name: Driving Force Pro
              value: DrivingForcePro
            - name: GT Force
              value: GTForce
            - name: Virtual
              value: Virtual
