# Standard hotkeys of Retrobox: which controller combination does what.
#
# Input names are EmulationStation's (es_input.cfg): hotkey, start, select,
# a, b, x, y, up, down, left, right, pageup (L1), pagedown (R1), l2, r2, l3,
# r3... "hotkey" is the controller's hotkey button; without a dedicated one
# EmulationStation maps it to select.
#
# Each emulator says how it performs every action (its generator's
# hotkey_bindings()); an action an emulator cannot perform gets no
# combination. Only player 1 gets these hotkeys, as in Batocera.
#
# "tap: true" fires when the button is released alone (retrobox-overlay's
# input daemon maps these); a tap on the hotkey is ignored when the hotkey is
# select, so it never takes a button the game needs.
#
# The overlay is not here: retrobox-overlay's daemon opens it everywhere in
# Retrobox (EmulationStation too) with Hotkey+B on every controller, when a
# dedicated hotkey (Home/Guide) is held for a moment, or on Ctrl+Shift+O or Shift+F7 (see its
# overlay.ini, hold_ms). Where the hotkey is a button the game uses (Select),
# holding it opens nothing. Save states and their slots are the overlay's too.
#
# "keyboard" holds the keyboard chords, as evdev key names (the right-hand
# modifiers count as the left-hand ones). The input daemon watches every keyboard
# without taking the keys from the game, so a chord also reaches the
# emulator: these use keys emulators leave free (RetroArch's own Shift+key
# hotkeys use F1-F4 and F9-F12, and P; Ctrl+Shift+O and Shift+F7 are the overlay's). Only
# commands (leaving the game) are bound to the keyboard; an emulator that reads the chord itself
# (RetroArch's Shift+Esc) is left alone.
#
# To change them, copy this file to ~/.config/retrobox/pad2key/hotkeys.yaml
# and edit the copy: each section it has ("pad", "keyboard") replaces this
# file's; a section it lacks is taken from here.

pad:
  - {action: exit, trigger: [hotkey, start]}
  # Hotkey+X is a screenshot in every emulator and app. Where two lines
  # share a combination, the first one the emulator can perform wins. Exit,
  # screenshot and the on-screen keyboard also win over the combinations of
  # an app's own gamepad profile.
  - {action: screenshot, trigger: [hotkey, x]}
  - {action: osk, trigger: [hotkey, y]}
  - {action: rewind, trigger: [hotkey, left]}
  - {action: fast_forward, trigger: [hotkey, right]}
  - {action: translate, trigger: [hotkey, pagedown]}
  - {action: swap_screens, trigger: [hotkey, l2]}
  - {action: next_layout, trigger: [hotkey, r2]}
  - {action: disk_next, trigger: [hotkey, l3]}
  - {action: toggle_bezel, trigger: [hotkey, r3]}

keyboard:
  - {action: exit, trigger: [KEY_LEFTSHIFT, KEY_ESC]}
