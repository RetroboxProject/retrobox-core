loopy:
  fullname: Casio Loopy
  manufacturer: Casio
  release: 1995
  hardware: console
  extension:
  - .bin
  - .ic1
  - .zip
  - .7z
  platform:
  - loopy
  theme: loopy
  emulators:
    libretro:
      cores:
        mame:
          default: true
    mame:
      cores:
        mame: {}
  bios:
  # MAME also finds its sets in bios/mame and roms/mame: not required here
  - file: casloopy.zip
    optional: true
