pv2000:
  fullname: PV-2000
  manufacturer: Casio
  release: 1983
  hardware: console
  extension:
  - .bin
  - .cas
  - .zip
  - .7z
  platform:
  - pv2000
  theme: pv2000
  emulators:
    libretro:
      cores:
        mame:
          default: true
    mame:
      cores:
        mame: {}
  bios:
  # MAME also finds its sets in bios/mame and roms/mame: not required here
  - file: pv2000.zip
    optional: true
