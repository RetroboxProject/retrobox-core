neogeocd:
  fullname: Neo-Geo CD
  manufacturer: SNK
  release: 1994
  hardware: console
  # an optical drive: the overlay offers the tray (and the discs of an .m3u)
  disc_drive: true
  extension:
  - .cue
  - .iso
  - .chd
  platform:
  - neogeocd
  theme: neogeocd
  emulators:
    libretro:
      cores:
        neocd:
          default: true
  # md5 of the known good dumps: batocera-systems (batocera.linux)
  bios:
