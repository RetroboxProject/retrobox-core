neogeo:
  fullname: Neo-Geo
  manufacturer: SNK
  release: 1990
  hardware: console
  extension:
  - .7z
  - .zip
  platform:
  - neogeo
  - arcade
  theme: neogeo
  emulators:
    libretro:
      cores:
        fbneo:
          default: true
        mame: {}
        mame078plus: {}
    mame:
      cores:
        mame: {}
  bios:
  - name: Neo Geo BIOS
    # FBNeo and MAME also find it next to the games
    one_of:
    - file: neogeo.zip
    - file: mame/neogeo.zip
    - file: "{roms}/neogeo/neogeo.zip"
    - file: "{roms}/mame/neogeo.zip"
