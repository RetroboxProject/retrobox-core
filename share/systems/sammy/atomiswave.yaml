atomiswave:
  fullname: Atomiswave
  manufacturer: Sammy
  release: 2003
  hardware: arcade
  extension:
  - .lst
  - .bin
  - .dat
  - .zip
  - .7z
  platform:
  - atomiswave
  - arcade
  theme: atomiswave
  emulators:
    flycast:
      cores:
        flycast: {}
    libretro:
      cores:
        flycast:
          default: true
  bios:
  - name: Atomiswave BIOS
    # Flycast also finds it next to the games
    one_of:
    - file: dc/awbios.zip
    - file: "{roms}/atomiswave/awbios.zip"
