amigacdtv:
  fullname: Amiga CDTV
  manufacturer: Commodore
  release: 1991
  hardware: console
  # an optical drive: the overlay offers the tray (and the discs of an .m3u)
  disc_drive: true
  extension:
  - .bin
  - .cue
  - .iso
  - .chd
  - .m3u
  platform:
  - amigacdtv
  theme: amigacdtv
  emulators:
    libretro:
      cores:
        puae:
          default: true
        puae2021: {}
