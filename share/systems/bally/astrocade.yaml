astrocade:
  fullname: Astrocade
  manufacturer: Bally
  release: 1978
  hardware: console
  extension:
  - .bin
  - .zip
  - .7z
  platform:
  - astrocade
  theme: astrocade
  emulators:
    libretro:
      cores:
        mame: {}
    mame:
      cores:
        mame:
          default: true
  bios:
  # MAME also finds its sets in bios/mame and roms/mame: not required here
  - file: astrocde.zip
    optional: true
