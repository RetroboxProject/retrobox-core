mz80k:
  fullname: Sharp MZ-80K
  manufacturer: Sharp
  release: 1978
  hardware: computer
  extension:
  - .mzf
  - .mzt
  - .m12
  - .wav
  - .zip
  - .7z
  platform:
  - mz80k
  theme: mz80k
  emulators:
    libretro:
      cores:
        mame:
          default: true
    mame:
      cores:
        mame: {}
  bios:
  # MAME also finds its sets in bios/mame and roms/mame: not required here
  - file: mz80k.zip
    optional: true
  - file: mz80kj.zip
    optional: true
