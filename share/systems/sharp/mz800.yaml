mz800:
  fullname: Sharp MZ-800
  manufacturer: Sharp
  release: 1984
  hardware: computer
  extension:
  - .mzf
  - .mzt
  - .m12
  - .wav
  - .zip
  - .7z
  platform:
  - mz800
  theme: mz800
  emulators:
    libretro:
      cores:
        mame:
          default: true
    mame:
      cores:
        mame: {}
  bios:
  # MAME also finds its sets in bios/mame and roms/mame: not required here
  - file: mz800.zip
    optional: true
