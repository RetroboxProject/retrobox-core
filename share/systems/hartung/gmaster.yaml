gmaster:
  fullname: Game Master
  manufacturer: Hartung
  release: 1990
  hardware: portable
  extension:
  - .bin
  - .zip
  - .7z
  platform:
  - gmaster
  theme: gmaster
  emulators:
    libretro:
      cores:
        mame: {}
    mame:
      cores:
        mame:
          default: true
  bios:
  # MAME also finds its sets in bios/mame and roms/mame: not required here
  - file: gmaster.zip
    optional: true
