gamecom:
  fullname: Game.com
  manufacturer: Tiger Electronics
  release: 1997
  hardware: portable
  extension:
  - .bin
  - .tgc
  - .zip
  - .7z
  platform:
  - gamecom
  theme: gamecom
  emulators:
    libretro:
      cores:
        mame: {}
    mame:
      cores:
        mame:
          default: true
  bios:
  # MAME also finds its sets in bios/mame and roms/mame: not required here
  - file: gamecom.zip
    optional: true
