n64dd:
  fullname: Nintendo 64 Disk Drive
  manufacturer: Nintendo
  release: 1999
  hardware: console
  extension:
  - .z64
  - .n64
  - .ndd
  - .zip
  - .7z
  platform:
  - n64dd
  theme: n64dd
  emulators:
    libretro:
      cores:
        mupen64plus_next:
          default: true
        parallel_n64: {}
    ares:
      cores:
        n64:
          incompatible_extensions:
          - .z64
          - .n64
          - .7z
  # md5 of the known good dumps: batocera-systems (batocera.linux)
  bios:
  - name: 64DD IPL
    file: 64DD_IPL.bin
    md5: 8d3d9f294b6e174bc7b1d2fd1c727530
