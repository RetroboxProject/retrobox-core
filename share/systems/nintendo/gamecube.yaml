gamecube:
  fullname: GameCube
  manufacturer: Nintendo
  release: 2001
  hardware: console
  # an optical drive: the overlay offers the tray (and the discs of an .m3u)
  disc_drive: true
  extension:
  - .gcm
  - .iso
  - .gcz
  - .ciso
  - .wbfs
  - .rvz
  - .elf
  - .dol
  - .m3u
  - .json
  platform:
  - gc
  theme: gc
  emulators:
    dolphin:
      cores:
        dolphin:
          default: true
    libretro:
      cores:
        dolphin: {}
  # md5 of the known good dumps: batocera-systems (batocera.linux)
  bios:
  - file: GC/EUR/IPL.bin
    md5: db92574caab77a7ec99d4605fd6f2450
    optional: true
  - file: GC/JAP/IPL.bin
    md5: b17148254a5799684c7d783206504926
    optional: true
  - file: GC/USA/IPL.bin
    md5: b17148254a5799684c7d783206504926
    optional: true
