    optional: true
  - file: gb_bios.bin
    md5: 32fbbd84168d3482956eb3c5051637f5
    optional: true
  - file: gbc_bios.bin
    md5: dbfce9db9deaa2567f6a84fde55f9680
    optional: true
  - file: sgb_bios.bin
    md5: d574d4f9c12f305074798f54c091a8b4
    optional: true
