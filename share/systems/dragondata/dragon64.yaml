dragon64:
  fullname: Dragon 64
  manufacturer: Dragon Data
  release: 1983
  hardware: computer
  extension:
  - .wav
  - .cas
  - .dsk
  - .dmk
  - .ccc
  - .rom
  - .bin
  - .zip
  - .7z
  platform:
  - dragon64
  theme: dragon64
  emulators:
    libretro:
      cores:
        mame:
          default: true
    mame:
      cores:
        mame: {}
  bios:
  # MAME also finds its sets in bios/mame and roms/mame: not required here
  - file: dragon64.zip
    optional: true
  - file: dragon32.zip
    optional: true
