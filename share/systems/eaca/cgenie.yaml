cgenie:
  fullname: Colour Genie
  manufacturer: EACA
  release: 1982
  hardware: computer
  extension:
  - .cas
  - .wav
  - .zip
  - .7z
  platform:
  - cgenie
  theme: cgenie
  emulators:
    libretro:
      cores:
        mame:
          default: true
    mame:
      cores:
        mame: {}
  bios:
  # MAME also finds its sets in bios/mame and roms/mame: not required here
  - file: cgenie.zip
    optional: true
