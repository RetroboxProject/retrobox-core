gamepock:
  fullname: Game Pocket Computer
  manufacturer: Epoch
  release: 1984
  hardware: portable
  extension:
  - .bin
  - .zip
  - .7z
  platform:
  - gamepock
  theme: gamepock
  emulators:
    libretro:
      cores:
        mame: {}
    mame:
      cores:
        mame:
          default: true
  bios:
  # MAME also finds its sets in bios/mame and roms/mame: not required here
  - file: gamepock.zip
    optional: true
