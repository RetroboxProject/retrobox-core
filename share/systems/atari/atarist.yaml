atarist:
  fullname: Atari ST
  manufacturer: Atari
  release: 1985
  hardware: computer
  extension:
  - .st
  - .msa
  - .stx
  - .dim
  - .ipf
  - .m3u
  - .zip
  - .7z
  - .hd
  - .gemdos
  platform:
  - atarist
  theme: atarist
  emulators:
    libretro:
      cores:
        hatari:
          default: true
          incompatible_extensions:
          - .hd
          - .gemdos
        hatarib: {}
