supracan:
  fullname: Super ACan
  manufacturer: Funtech Entertainment
  release: 1995
  hardware: console
  extension:
  - .bin
  - .zip
  - .7z
  platform:
  - supracan
  theme: supracan
  emulators:
    libretro:
      cores:
        mame: {}
    mame:
      cores:
        mame:
          default: true
  bios:
  # MAME also finds its sets in bios/mame and roms/mame: not required here
  - file: supracan.zip
    optional: true
  - file: umc6650.zip
    optional: true
