advision:
  fullname: Adventure Vision
  manufacturer: Entex
  release: 1982
  hardware: console
  extension:
  - .bin
  - .zip
  - .7z
  platform:
  - advision
  theme: advision
  emulators:
    libretro:
      cores:
        mame: {}
    mame:
      cores:
        mame:
          default: true
  bios:
  # MAME also finds its sets in bios/mame and roms/mame: not required here
  - file: advision.zip
    optional: true
