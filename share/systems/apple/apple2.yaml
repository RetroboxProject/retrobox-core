apple2:
  fullname: Apple II
  manufacturer: Apple
  release: 1977
  hardware: computer
  extension:
  - .nib
  - .do
  - .po
  - .dsk
  - .mfi
  - .dfi
  - .rti
  - .edd
  - .woz
  - .wav
  - .zip
  - .7z
  - .chd
  - .hdv
  - .2mg
  platform:
  - apple2
  theme: apple2
  emulators:
    libretro:
      cores:
        mame:
          default: true
    mame:
      cores:
        mame: {}
  bios:
  # MAME also finds its sets in bios/mame and roms/mame: not required here
  - file: apple2e.zip
    optional: true
  - file: apple2ee.zip
    optional: true
  - file: apple2p.zip
    optional: true
  - file: a2diskiing.zip
    optional: true
  - file: a2cffa02.zip
    optional: true
  - file: votrsc01.zip
    optional: true
  - file: votrsc01a.zip
    optional: true
  - file: d2fdc.zip
    optional: true
