pcfx:
  fullname: PC-FX
  manufacturer: NEC
  release: 1994
  hardware: console
  # an optical drive: the overlay offers the tray (and the discs of an .m3u)
  disc_drive: true
  extension:
  - .cue
  - .ccd
  - .toc
  - .chd
  - .zip
  - .7z
  - .m3u
  platform:
  - pcfx
  theme: pcfx
  emulators:
    libretro:
      cores:
        pcfx:
          default: true
  # md5 of the known good dumps: batocera-systems (batocera.linux)
  bios:
  - name: PC-FX BIOS
    file: pcfx.rom
    md5: 08e36edbea28a017f79f8d4f7ff9b6d7
