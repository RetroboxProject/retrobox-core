pcengine:
  fullname: PC Engine
  manufacturer: NEC
  release: 1987
  hardware: console
  extension:
  - .pce
  - .bin
  - .zip
  - .7z
  platform:
  - pcengine
  theme: pcengine
  emulators:
    libretro:
      cores:
        mednafen_pce:
          default: true
        mednafen_pce_fast: {}
    ares:
      cores:
        pcengine:
          incompatible_extensions:
          - .bin
          - .7z
  # md5 of the known good dumps: batocera-systems (batocera.linux)
  bios:
  - file: syscard3.pce
    md5: 38179df8f4ac870017db21ebcbf53114
    optional: true
