pc60:
  fullname: PC-6000
  manufacturer: NEC
  release: 1981
  hardware: computer
  extension:
  - .bin
  - .cas
  - .p6
  - .d77
  - .d88
  - .dsk
  - .1dd
  - .mfi
  - .dfi
  - .mfm
  - .td0
  - .imd
  - .cqm
  - .cqi
  - .xdf
  - .hdm
  - .2hd
  - .fdi
  - .zip
  - .7z
  platform:
  - pc60
  theme: pc60
  emulators:
    libretro:
      cores:
        mame:
          default: true
    mame:
      cores:
        mame: {}
  bios:
  # MAME also finds its sets in bios/mame and roms/mame: not required here
  - file: pc6001.zip
    optional: true
  - file: pc6001a.zip
    optional: true
  - file: pc6001mk2.zip
    optional: true
  - file: pc6001mk2sr.zip
    optional: true
