supergrafx:
  fullname: Supergrafx
  manufacturer: NEC
  release: 1989
  hardware: console
  extension:
  - .pce
  - .sgx
  - .cue
  - .ccd
  - .chd
  - .zip
  - .7z
  platform:
  - supergrafx
  theme: supergrafx
  emulators:
    libretro:
      cores:
        mednafen_supergrafx:
          default: true
    ares:
      cores:
        pcengine:
          incompatible_extensions:
          - .pce
          - .cue
          - .ccd
          - .chd
          - .7z
  # md5 of the known good dumps: batocera-systems (batocera.linux)
  bios:
  - file: syscard3.pce
    md5: 38179df8f4ac870017db21ebcbf53114
    optional: true
