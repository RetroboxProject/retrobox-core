vsmile:
  fullname: V.Smile
  manufacturer: VTech
  release: 2005
  hardware: console
  extension:
  - .u1
  - .u3
  - .bin
  - .zip
  - .7z
  platform:
  - vsmile
  theme: vsmile
  emulators:
    libretro:
      cores:
        mame: {}
    mame:
      cores:
        mame:
          default: true
  bios:
  # MAME also finds its sets in bios/mame and roms/mame: not required here
  - file: vsmile.zip
    optional: true
