socrates:
  fullname: Socrates
  manufacturer: VTech
  release: 1988
  hardware: console
  extension:
  - .bin
  - .zip
  - .7z
  platform:
  - socrates
  theme: socrates
  emulators:
    libretro:
      cores:
        mame: {}
    mame:
      cores:
        mame:
          default: true
  bios:
  # MAME also finds its sets in bios/mame and roms/mame: not required here
  - file: socrates.zip
    optional: true
