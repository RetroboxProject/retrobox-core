crvision:
  fullname: CreatiVision
  manufacturer: VTech
  release: 1982
  hardware: console
  extension:
  - .bin
  - .rom
  - .zip
  - .7z
  platform:
  - crvision
  theme: creativision
  emulators:
    libretro:
      cores:
        mame: {}
    mame:
      cores:
        mame:
          default: true
  bios:
  # MAME also finds its sets in bios/mame and roms/mame: not required here
  - file: crvision.zip
    optional: true
