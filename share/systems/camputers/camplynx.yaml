camplynx:
  fullname: Camputers Lynx
  manufacturer: Camputers
  release: 1983
  hardware: computer
  extension:
  - .wav
  - .tap
  - .ldf
  - .zip
  - .7z
  platform:
  - camplynx
  theme: camplynx
  emulators:
    libretro:
      cores:
        mame: {}
    mame:
      cores:
        mame:
          default: true
  bios:
  # MAME also finds its sets in bios/mame and roms/mame: not required here
  - file: lynx48k.zip
    optional: true
  - file: lynx96k.zip
    optional: true
  - file: lynx128k.zip
    optional: true
