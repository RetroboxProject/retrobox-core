ti99:
  fullname: TI-99
  manufacturer: Texas Instruments
  release: 1981
  hardware: computer
  extension:
  - .rpk
  - .wav
  - .zip
  - .7z
  platform:
  - ti99
  theme: ti99
  emulators:
    libretro:
      cores:
        mame: {}
    mame:
      cores:
        mame:
          default: true
  bios:
  # MAME also finds its sets in bios/mame and roms/mame: not required here
  - file: ti99_4a.zip
    optional: true
  - file: ti99_speech.zip
    optional: true
