apfm1000:
  fullname: M-1000
  manufacturer: APF Electronics
  release: 1978
  hardware: console
  extension:
  - .bin
  - .zip
  - .7z
  platform:
  - apfm1000
  theme: apfm1000
  emulators:
    libretro:
      cores:
        mame: {}
    mame:
      cores:
        mame:
          default: true
  bios:
  # MAME also finds its sets in bios/mame and roms/mame: not required here
  - file: apfm1000.zip
    optional: true
