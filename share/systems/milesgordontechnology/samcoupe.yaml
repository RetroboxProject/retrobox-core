samcoupe:
  fullname: SAM Coupé
  manufacturer: Miles Gordon Technology
  release: 1989
  hardware: computer
  extension:
  - .cpm
  - .dsk
  - .sad
  - .mgt
  - .sdf
  - .td0
  - .sbt
  - .zip
  platform:
  - samcoupe
  theme: samcoupe
  emulators:
    libretro:
      cores:
        mame:
          default: true
    mame:
      cores:
        mame: {}
  bios:
  # MAME also finds its sets in bios/mame and roms/mame: not required here
  - file: samcoupe.zip
    optional: true
