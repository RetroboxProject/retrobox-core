naomi:
  fullname: Naomi
  manufacturer: Sega
  release: 1998
  hardware: arcade
  extension:
  - .lst
  - .bin
  - .dat
  - .zip
  - .7z
  platform:
  - naomi
  - arcade
  theme: naomi
  emulators:
    flycast:
      cores:
        flycast: {}
    libretro:
      cores:
        flycast:
          default: true
  bios:
  - name: NAOMI BIOS
    # Flycast also finds it next to the games
    one_of:
    - file: dc/naomi.zip
    - file: "{roms}/naomi/naomi.zip"
