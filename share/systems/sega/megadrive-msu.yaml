megadrive-msu:
  fullname: MSU-MD
  manufacturer: Sega
  release: 2020
  hardware: console
  extension:
  - .md
  - .zip
  - .7z
  - .squashfs
  platform:
  - genesis
  - megadrive
  theme: megadrive-msu
  group: megadrive
  emulators:
    libretro:
      cores:
        genesis_plus_gx:
          default: true
        genesis_plus_gx-wide: {}
  # md5 of the known good dumps: batocera-systems (batocera.linux)
  bios:
  - name: Mega-CD BIOS
    # MSU-MD runs on the Mega-CD's
    one_of:
    - file: bios_CD_E.bin
      md5: e66fa1dc5820d254611fdcdba0662372
    - file: bios_CD_U.bin
      md5: 854b9150240a198070150e4566ae1290
    - file: bios_CD_J.bin
      md5: 278a9397d192149e84e820ac621a8edd
