beena:
  fullname: Advanced Pico Beena
  manufacturer: Sega
  release: 2005
  hardware: console
  extension:
  - .bin
  - .zip
  - .7z
  platform:
  - beena
  theme: beena
  emulators:
    libretro:
      cores:
        mame:
          default: true
    mame:
      cores:
        mame: {}
  bios:
  # MAME also finds its sets in bios/mame and roms/mame: not required here
  - file: beena.zip
    optional: true
