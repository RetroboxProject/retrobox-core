megacd:
  fullname: Mega CD
  manufacturer: Sega
  release: 1991
  hardware: console
  # an optical drive: the overlay offers the tray (and the discs of an .m3u)
  disc_drive: true
  extension:
  - .cue
  - .iso
  - .chd
  - .m3u
  platform:
  - megacd
  theme: megacd
  emulators:
    libretro:
      cores:
        genesis_plus_gx:
          default: true
        picodrive: {}
    ares:
      cores:
        megadrive:
          incompatible_extensions:
          - .iso
          - .m3u
  # md5 of the known good dumps: batocera-systems (batocera.linux)
  bios:
  - name: Mega-CD BIOS
    # one per region: the one of each game's region
    one_of:
    - file: bios_CD_E.bin
      md5: e66fa1dc5820d254611fdcdba0662372
    - file: bios_CD_U.bin
      md5: 854b9150240a198070150e4566ae1290
    - file: bios_CD_J.bin
      md5: 278a9397d192149e84e820ac621a8edd
