psx:
  fullname: PlayStation
  manufacturer: Sony
  release: 1994
  hardware: console
  # an optical drive: the overlay offers the tray (and the discs of an .m3u)
  disc_drive: true
  extension:
  - .cue
  - .img
  - .mdf
  - .pbp
  - .toc
  - .cbn
  - .m3u
  - .ccd
  - .chd
  - .iso
  platform:
  - psx
  theme: psx
  emulators:
    libretro:
      cores:
        mednafen_psx: {}
        pcsx_rearmed:
          default: true
        swanstation: {}
    ares:
      cores:
        psx:
          incompatible_extensions:
          - .img
          - .mdf
          - .pbp
          - .toc
          - .cbn
          - .m3u
          - .ccd
          - .iso
  # md5 of the known good dumps: libretro's System.dat and batocera-systems
  bios:
  - name: PlayStation BIOS
    # any region and revision; pcsx_rearmed has a replacement of its own (less
    # compatible), ares only takes the dumps it knows (ares_firmware.py)
    one_of:
    - file: scph1000.bin
      md5: 239665b1a3dade1b5a52c06338011044
      note: Japan
    - file: scph1001.bin
      md5: [924e392ed05558ffdb115408c263dccf, dc2b9bf8da62ec93e868cfd29f0d067d]
      note: USA
    - file: scph1002.bin
      md5: 54847e693405ffeb0359c6287434cbef
      note: Europe
    - file: scph100.bin
      md5: 8abc1b549a4a80954addc48ef02c4521
      note: "PSone, Japan"
    - file: scph101.bin
      md5: 6e3735ff4c7dc899ee98981385f6f3d0
      note: "PSone, USA"
    - file: scph102A.bin
      md5: b10f5e0e3d9eb60e5159690680b1e774
      note: "PSone, Europe"
    - file: scph102B.bin
      md5: de93caec13d1a141a40a79f5c86168d6
      note: "PSone, Europe"
    - file: scph102C.bin
      md5: de93caec13d1a141a40a79f5c86168d6
      note: "PSone, Europe"
    - file: scph3000.bin
      md5: 849515939161e62f6b866f6853006780
      note: Japan
    - file: scph3500.bin
      md5: cba733ceeff5aef5c32254f1d617fa62
      note: Japan
    - file: scph5000.bin
      md5: eb201d2d98251a598af467d4347bb62f
      note: Japan
    - file: scph5500.bin
      md5: 8dd7d5296a650fac7319bce665a6a53c
