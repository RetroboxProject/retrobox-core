ps2:
  fullname: PlayStation 2
  manufacturer: Sony
  release: 2000
  hardware: console
  # an optical drive: the overlay offers the tray (and the discs of an .m3u)
  disc_drive: true
  extension:
  - .iso
  - .mdf
  - .nrg
  - .bin
  - .img
  - .dump
  - .gz
  - .cso
  - .chd
  - .m3u
  - .elf
  platform:
  - ps2
  theme: ps2
  emulators:
    libretro:
      cores:
        pcsx2: {}
        play:
          incompatible_extensions:
          - .m3u
    pcsx2:
      cores:
        pcsx2:
          default: true
          incompatible_extensions:
          - .m3u
          options:
            hud_support: true
  bios:
  - name: PlayStation 2 BIOS
    one_of:
    # any dump does; PCSX2 prefers ps2-0230e-20080220.bin (Europe, 2008), and
    # a game can ask for another one (pcsx2_forcebios)
    - file: pcsx2/bios/*.bin
      # the real images are 4 MiB: this leaves out the NVM and MEC files
      min_size: 1048576
    # Play! runs without one
    required_for: [pcsx2, libretro/pcsx2]
