ps2:
  fullname: PlayStation 2
  manufacturer: Sony
  release: 2000
  hardware: console
  # an optical drive: the overlay offers the tray (and the discs of an .m3u)
  disc_drive: true
  extension:
  - .iso
  - .mdf
  - .nrg
  - .bin
  - .img
  - .dump
  - .gz
  - .cso
  - .chd
  - .m3u
  - .elf
  platform:
  - ps2
  theme: ps2
  emulators:
    libretro:
      cores:
        pcsx2: {}
        play:
          incompatible_extensions:
          - .m3u
    pcsx2:
      cores:
        pcsx2:
          default: true
          incompatible_extensions:
          - .m3u
          options:
            hud_support: true
  # md5 of the known good dumps: libretro's System.dat
  bios:
  - name: PlayStation 2 BIOS
    # any region and revision (PCSX2 prefers ps2-0230e-20080220.bin, and a game can ask
    # for another one: pcsx2_forcebios); Play! runs without one
