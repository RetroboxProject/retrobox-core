tutor:
  fullname: Tutor
  manufacturer: Tomy
  release: 1983
  hardware: computer
  extension:
  - .bin
  - .wav
  - .zip
  - .7z
  platform:
  - tutor
  theme: tutor
  emulators:
    libretro:
      cores:
        mame: {}
    mame:
      cores:
        mame:
          default: true
  bios:
