mc10:
  fullname: MC-10
  manufacturer: Tandy Radio Shack
  release: 1983
  hardware: computer
  extension:
  - .wav
  - .cas
  - .rom
  - .bin
  - .zip
  - .7z
  platform:
  - mc10
  theme: mc10
  emulators:
    libretro:
      cores:
        mame:
          default: true
    mame:
      cores:
        mame: {}
  bios:
  # MAME also finds its sets in bios/mame and roms/mame: not required here
  - file: mc10.zip
    optional: true
  - file: alice.zip
    optional: true
