trs80:
  fullname: TRS-80
  manufacturer: Tandy Radio Shack
  release: 1977
  hardware: computer
  extension:
  - .cmd
  - .cas
  - .dsk
  - .dmk
  - .bas
  - .wav
  - .zip
  - .7z
  platform:
  - trs80
  theme: trs80
  emulators:
    libretro:
      cores:
        mame:
          default: true
    mame:
      cores:
        mame: {}
  bios:
  # MAME also finds its sets in bios/mame and roms/mame: not required here
  - file: trs80.zip
    optional: true
  - file: trs80m3.zip
    optional: true
  - file: trs80m4.zip
    optional: true
  - file: trs80m4p.zip
    optional: true
