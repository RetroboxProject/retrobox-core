emulator_name: libretro
core_name: swanstation
groups:
  GENERAL:
    submenus:
      SCREEN:
        - name: INTERNAL RESOLUTION
          value: swanstation_resolution_scale
          description: Multiplies the native PlayStation resolution. Bigger is sharper and slower.
          core_option: swanstation_GPU_ResolutionScale
          choices:
            - name: Default
              value: auto
            - name: 1x (native)
              value: '1'
            - name: 2x
              value: '2'
            - name: 3x
              value: '3'
            - name: 4x
              value: '4'
            - name: 5x
              value: '5'
            - name: 6x
              value: '6'
            - name: 8x
              value: '8'
            - name: 10x
              value: '10'
            - name: 12x
              value: '12'
            - name: 16x
              value: '16'
  CONTROLS:
    submenus:
      PORT 1:
        - name: CONTROLLER TYPE
          value: controller1_swanstation
          description: >-
            Controller plugged into port 1. Standard has no analog sticks: the left stick of your pad drives the D-pad, which keeps working too. The DualShock and the analog joystick read both sticks; the DualShock also rumbles. The mouse is a real one, plugged into the computer.
          core_option: false
          choices:
            - name: Standard (Default)
              value: auto
            - name: DualShock
              value: '261'
            - name: Analog Joystick
              value: '517'
            - name: neGcon
              value: '773'
            - name: neGcon Rumble
              value: '1029'
            - name: Mouse
              value: '258'
      PORT 2:
        - name: CONTROLLER TYPE
          value: controller2_swanstation
          description: >-
            Controller plugged into port 2. Standard has no analog sticks: the left stick of your pad drives the D-pad, which keeps working too. The DualShock and the analog joystick read both sticks; the DualShock also rumbles. The mouse is a real one, plugged into the computer.
          core_option: false
          choices:
            - name: Standard (Default)
              value: auto
            - name: DualShock
              value: '261'
            - name: Analog Joystick
              value: '517'
            - name: neGcon
              value: '773'
            - name: neGcon Rumble
              value: '1029'
            - name: Mouse
              value: '258'
