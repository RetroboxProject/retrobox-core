emulator_name: mupen64plus
sharedFeatures:
  - power_profile
  - tdp
  - videomode
  - bezel
  - bezel_stretch
  - hud
  - hud_corner
  - hud_custom
  - bezel.tattoo
  - bezel.tattoo_corner
  - bezel.tattoo_file
  - bezel.resize_tattoo
# Not in the menu: mupen64plus_cheats, a string passed as it is to the --cheats option
# (set it in retrobox.ini or in the game's options file).
groups:
  GENERAL:
    submenus:
      SCREEN:
        - name: GAME ASPECT RATIO
          value: mupen64plus_ratio
          description: Rice always stretches the picture to the screen.
          choices:
            - name: "4:3 (Default)"
              value: "4/3"
            - name: "16:9"
              value: "16/9"
        - name: HORIZONTAL OVERSCAN (GLIDEN64 AND GLIDE64MK2)
          value: mupen64plus_OverscanHorizontal
          description: Pixels cropped on the left and the right to hide junk at the edges of the picture, which is scaled to fill the screen. N64 pixels, up to 20. Rice has none, and Glide64mk2 loses anti-aliasing with it.
          choices: &overscan
            - {name: "Off (Default)", value: 0}
            - {name: "1 px", value: 1}
            - {name: "2 px", value: 2}
            - {name: "3 px", value: 3}
            - {name: "4 px", value: 4}
            - {name: "5 px", value: 5}
            - {name: "6 px", value: 6}
            - {name: "7 px", value: 7}
            - {name: "8 px", value: 8}
            - {name: "9 px", value: 9}
            - {name: "10 px", value: 10}
            - {name: "11 px", value: 11}
            - {name: "12 px", value: 12}
            - {name: "13 px", value: 13}
            - {name: "14 px", value: 14}
            - {name: "15 px", value: 15}
            - {name: "16 px", value: 16}
            - {name: "17 px", value: 17}
            - {name: "18 px", value: 18}
            - {name: "19 px", value: 19}
            - {name: "20 px", value: 20}
        - name: VERTICAL OVERSCAN (GLIDEN64 AND GLIDE64MK2)
          value: mupen64plus_OverscanVertical
          description: Pixels cropped on the top and the bottom to hide junk at the edges of the picture, which is scaled to fill the screen. N64 pixels, up to 20. Rice has none, and Glide64mk2 loses anti-aliasing with it.
          choices: *overscan
        - name: ANISOTROPIC FILTERING
          value: mupen64plus_Anisotropic
          description: Sharper distant textures (Rice needs mip-mapping).
          choices:
            - name: "Off"
              value: 0
            - name: 2x
              value: 2
            - name: 4x
              value: 4
            - name: 8x
              value: 8
            - name: 16x
              value: 16
        - name: WAIT FOR THE GPU EVERY FRAME
          value: mupen64plus_WaitForGPU
          description: Off lets the GPU work ahead of the CPU, which can recover speed in slow devices (Switch) at the cost of a frame of latency.
          choices:
            - name: On (Default)
              value: "True"
            - name: "Off"
              value: "False"
      AUDIO:
        - name: AUDIO SYNC
          value: mupen64plus_AudioSync
          description: A second audio limiter. Better audio, slower.
          choices:
            - name: "Off"
              value: "False"
            - name: "On"
              value: "True"
        - name: AUDIO BUFFER (SAMPLES)
          value: mupen64plus_AudioBuffer
          description: Lower is faster and has less latency, but can crackle.
          choices:
            - name: Very High
              value: Very High
            - name: High
              value: High
            - name: Medium (Default)
              value: Medium
            - name: Low
              value: Low
      EMULATION:
        - name: DISABLE 4MB EXPANSION RAM PACK
          value: mupen64plus_DisableExtraMem
          description: Some games need it off.
          choices:
            - name: "Off"
              value: "False"
            - name: "On"
              value: "True"
  CONTROLS:
    submenus:
      PORT 1:
        - name: CONTROLLER TYPE
          value: mupen64-controller1
          description: N64 is for a pad with the Nintendo 64 buttons.
          choices: &controller_type
            - name: RetroPad (Default)
              value: retropad
            - name: N64
              value: n64
        - name: SENSITIVITY
          value: mupen64-sensitivity1
          description: Multiplies the stick input.
          choices: &sensitivity
            - {name: "0.5x", value: "0.5"}
            - {name: "0.6x", value: "0.6"}
            - {name: "0.7x", value: "0.7"}
            - {name: "0.8x", value: "0.8"}
            - {name: "0.9x", value: "0.9"}
            - {name: "1x (Default)", value: "1.0"}
            - {name: "1.1x", value: "1.1"}
            - {name: "1.2x", value: "1.2"}
            - {name: "1.3x", value: "1.3"}
            - {name: "1.4x", value: "1.4"}
            - {name: "1.5x", value: "1.5"}
        - name: DEADZONE
          value: mupen64-deadzone1
          description: Stick area around the centre that is ignored.
          choices: &deadzone
            - {name: "0%", value: "0.0"}
            - {name: "1% (Default)", value: "0.01"}
            - {name: "5%", value: "0.05"}
            - {name: "10%", value: "0.1"}
            - {name: "15%", value: "0.15"}
            - {name: "20%", value: "0.2"}
            - {name: "25%", value: "0.25"}
      PORT 2:
        - name: CONTROLLER TYPE
          value: mupen64-controller2
          description: N64 is for a pad with the Nintendo 64 buttons.
          choices: *controller_type
        - name: SENSITIVITY
          value: mupen64-sensitivity2
          description: Multiplies the stick input.
          choices: *sensitivity
        - name: DEADZONE
          value: mupen64-deadzone2
          description: Stick area around the centre that is ignored.
          choices: *deadzone
      PORT 3:
        - name: CONTROLLER TYPE
          value: mupen64-controller3
          description: N64 is for a pad with the Nintendo 64 buttons.
          choices: *controller_type
        - name: SENSITIVITY
          value: mupen64-sensitivity3
          description: Multiplies the stick input.
          choices: *sensitivity
        - name: DEADZONE
          value: mupen64-deadzone3
          description: Stick area around the centre that is ignored.
          choices: *deadzone
      PORT 4:
        - name: CONTROLLER TYPE
          value: mupen64-controller4
          description: N64 is for a pad with the Nintendo 64 buttons.
          choices: *controller_type
        - name: SENSITIVITY
          value: mupen64-sensitivity4
          description: Multiplies the stick input.
          choices: *sensitivity
        - name: DEADZONE
          value: mupen64-deadzone4
          description: Stick area around the centre that is ignored.
          choices: *deadzone
