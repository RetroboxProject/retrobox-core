emulator_name: mupen64plus
sharedFeatures:
  - power_profile
  - tdp
  - videomode
  - bezel
  - bezel_stretch
  - hud
  - hud_corner
  - hud_custom
  - bezel.tattoo
  - bezel.tattoo_corner
  - bezel.tattoo_file
  - bezel.resize_tattoo
# Not in the menu: mupen64plus_cheats, a string passed as it is to the --cheats option
# (set it in retrobox.ini or in the game's options file).
groups:
  GENERAL:
    submenus:
      SCREEN:
        - name: GAME ASPECT RATIO
          value: mupen64plus_ratio
          description: The shape of the picture. Rice always stretches it to the screen.
          choices:
            - name: "4:3 (Default)"
              value: "4/3"
            - name: "16:9"
              value: "16/9"
        - name: RENDERING RESOLUTION (GLIDEN64 ONLY)
          value: mupen64plus_NativeResFactor
          description: Internal render size, whatever the window. Auto renders at the screen resolution. Games with a 640-wide picture double it.
          choices:
            - name: Auto (Screen) (Default)
              value: 0
            - name: 320x240 (1x, native)
              value: 1
            - name: 640x480 (2x)
              value: 2
            - name: 960x720 (3x)
              value: 3
            - name: 1280x960 (4x)
              value: 4
        - name: RENDERING RESOLUTION (GLIDE64MK2 ONLY)
          value: mupen64plus_glide64mk2_RenderHeight
          description: Internal render size, scaled to the screen without changing it. Auto renders at the screen resolution. Turns anti-aliasing off.
          choices:
            - name: Auto (Screen) (Default)
              value: 0
            - name: 320x240 (1x, native)
              value: 240
            - name: 640x480 (2x)
              value: 480
            - name: 960x720 (3x)
              value: 720
            - name: 1280x960 (4x)
              value: 960
            - name: 1440x1080
              value: 1080
        - name: ANTI-ALIASING (MSAA)
          value: mupen64plus_AntiAliasing
          description: Smooth out the jagged edges of 3D polygons (GLideN64 and Glide64mk2).
          choices:
            - name: "Off"
              value: 0
            - name: 2x
              value: 2
            - name: 4x
              value: 4
            - name: 8x
              value: 8
            - name: 16x
              value: 16
        - name: ANISOTROPIC FILTERING
          value: mupen64plus_Anisotropic
          description: Improves the clarity of distant textures (all plugins; in Rice it needs mip-mapping).
          choices:
            - name: "Off"
              value: 0
            - name: 2x
              value: 2
            - name: 4x
              value: 4
            - name: 8x
              value: 8
            - name: 16x
              value: 16
        - name: TEXTURE MIP-MAPPING (RICE ONLY)
          value: mupen64plus_Mipmapping
          description: Smooth the textures of distant 3D objects (blur).
          choices:
            - name: "Off"
              value: 0
            - name: Nearest
              value: 1
            - name: Bilinear
              value: 2
            - name: Trilinear
              value: 3
        - name: TEXTURE UPSCALING (RICE ONLY)
          value: mupen64plus_TextureEnhancement
          description: Upscale the textures of 3D objects.
          choices:
            - name: "Off"
              value: 0
            - name: 2X
              value: 1
            - name: 2XSAI
              value: 2
            - name: HQ2X
              value: 3
            - name: LQ2X
              value: 4
            - name: HQ4X
              value: 5
            - name: Sharpen
              value: 6
            - name: Sharpen More
              value: 7
            - name: External
              value: 8
            - name: Mirrored
              value: 9
        - name: LOAD CUSTOM TEXTURES (RICE ONLY)
          value: mupen64plus_LoadHiResTextures
          choices:
            - name: "Off"
              value: "False"
            - name: "On"
              value: "True"
        - name: READ FRAMEBUFFER EVERY FRAME (GLIDE64MK2 ONLY)
          value: mupen64plus_fb_read_always
          description: Required for some effects in-game (Banjo Kazooie and DK64 transitions), can cause slowdown.
          choices:
            - name: Game default
              value: -1
            - name: Disable
              value: 0
            - name: Enable
              value: 1
        - name: FRAMESKIP (GLIDE64MK2 ONLY)
          value: mupen64plus_frameskip
          description: Skip frames to improve performance, at the cost of choppy motion.
          choices:
            - name: "Off"
              value: 0
            - name: Autodetect
              value: automatic
            - name: "1"
              value: 1
            - name: "2"
              value: 2
            - name: "3"
              value: 3
            - name: "4"
              value: 4
            - name: "5"
              value: 5
      AUDIO:
        - name: AUDIO SYNC
          value: mupen64plus_AudioSync
          description: Enable a second audio limiter. Improves the audio quality at the cost of performance.
          choices:
            - name: "Off"
              value: "False"
            - name: "On"
              value: "True"
        - name: AUDIO BUFFER (SAMPLES)
          value: mupen64plus_AudioBuffer
          description: Lower values reduce the audio latency and improve performance, but can cause audio issues.
          choices:
            - name: Very High
              value: Very High
            - name: High
              value: High
            - name: Medium (Default)
              value: Medium
            - name: Low
              value: Low
      EMULATION:
        - name: DISABLE 4MB EXPANSION RAM PACK
          value: mupen64plus_DisableExtraMem
          description: Required by some games.
          choices:
            - name: "Off"
              value: "False"
            - name: "On"
              value: "True"
  CONTROLS:
    submenus:
      PORT 1:
        - name: CONTROLLER TYPE
          value: mupen64-controller1
          description: The layout of the buttons. Use N64 for a pad with the buttons of the Nintendo 64.
          choices: &controller_type
            - name: RetroPad (Default)
              value: retropad
            - name: N64
              value: n64
        - name: SENSITIVITY
          value: mupen64-sensitivity1
          description: A multiplier of the input of the stick, to lower or raise its responsiveness.
          choices: &sensitivity
            - {name: "0.5x", value: "0.5"}
            - {name: "0.6x", value: "0.6"}
            - {name: "0.7x", value: "0.7"}
            - {name: "0.8x", value: "0.8"}
            - {name: "0.9x", value: "0.9"}
            - {name: "1x (Default)", value: "1.0"}
            - {name: "1.1x", value: "1.1"}
            - {name: "1.2x", value: "1.2"}
            - {name: "1.3x", value: "1.3"}
            - {name: "1.4x", value: "1.4"}
            - {name: "1.5x", value: "1.5"}
        - name: DEADZONE
          value: mupen64-deadzone1
          description: The area around the neutral position of the stick where the input is ignored.
          choices: &deadzone
            - {name: "0%", value: "0.0"}
            - {name: "1% (Default)", value: "0.01"}
            - {name: "5%", value: "0.05"}
            - {name: "10%", value: "0.1"}
            - {name: "15%", value: "0.15"}
            - {name: "20%", value: "0.2"}
            - {name: "25%", value: "0.25"}
      PORT 2:
        - name: CONTROLLER TYPE
          value: mupen64-controller2
          description: The layout of the buttons. Use N64 for a pad with the buttons of the Nintendo 64.
          choices: *controller_type
        - name: SENSITIVITY
          value: mupen64-sensitivity2
          description: A multiplier of the input of the stick, to lower or raise its responsiveness.
          choices: *sensitivity
        - name: DEADZONE
          value: mupen64-deadzone2
          description: The area around the neutral position of the stick where the input is ignored.
          choices: *deadzone
      PORT 3:
        - name: CONTROLLER TYPE
          value: mupen64-controller3
          description: The layout of the buttons. Use N64 for a pad with the buttons of the Nintendo 64.
          choices: *controller_type
        - name: SENSITIVITY
          value: mupen64-sensitivity3
          description: A multiplier of the input of the stick, to lower or raise its responsiveness.
          choices: *sensitivity
        - name: DEADZONE
          value: mupen64-deadzone3
          description: The area around the neutral position of the stick where the input is ignored.
          choices: *deadzone
      PORT 4:
        - name: CONTROLLER TYPE
          value: mupen64-controller4
          description: The layout of the buttons. Use N64 for a pad with the buttons of the Nintendo 64.
          choices: *controller_type
        - name: SENSITIVITY
          value: mupen64-sensitivity4
          description: A multiplier of the input of the stick, to lower or raise its responsiveness.
          choices: *sensitivity
        - name: DEADZONE
          value: mupen64-deadzone4
          description: The area around the neutral position of the stick where the input is ignored.
          choices: *deadzone
