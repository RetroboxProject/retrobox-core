emulator_name: libretro
core_name: pcsx_rearmed
groups:
  CONTROLS:
    submenus:
      PORT 1:
        - name: CONTROLLER TYPE
          value: controller1_pcsx_rearmed
          description: >-
            Controller plugged into port 1. Standard has no analog sticks: the left stick of your pad drives the D-pad, which keeps working too. The DualShock and the analog joystick read both sticks; the DualShock also rumbles.
          core_option: false
          choices:
            - name: Standard (Default)
              value: auto
            - name: DualShock
              value: '517'
            - name: Analog Joystick
              value: '261'
            - name: neGcon
              value: '773'
      PORT 2:
        - name: CONTROLLER TYPE
          value: controller2_pcsx_rearmed
          description: >-
            Controller plugged into port 2. Standard has no analog sticks: the left stick of your pad drives the D-pad, which keeps working too. The DualShock and the analog joystick read both sticks; the DualShock also rumbles.
          core_option: false
          choices:
            - name: Standard (Default)
              value: auto
            - name: DualShock
              value: '517'
            - name: Analog Joystick
              value: '261'
            - name: neGcon
              value: '773'
