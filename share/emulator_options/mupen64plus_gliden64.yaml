emulator_name: mupen64plus
core_name: gliden64
groups:
  GENERAL:
    submenus:
      SCREEN:
        - name: RENDERING RESOLUTION
          value: mupen64plus_NativeResFactor
          description: Internal render size, whatever the window. Auto renders at the screen resolution. Games with a 640-wide picture double it.
          choices:
            - name: Auto (Screen) (Default)
              value: 0
            - name: 320x240 (1x, native)
              value: 1
            - name: 640x480 (2x)
              value: 2
            - name: 960x720 (3x)
              value: 3
            - name: 1280x960 (4x)
              value: 4
        - name: ANTI-ALIASING (MSAA)
          value: mupen64plus_AntiAliasing
          description: Smooths the edges of 3D polygons.
          choices:
            - name: "Off"
              value: 0
            - name: 2x
              value: 2
            - name: 4x
              value: 4
            - name: 8x
              value: 8
            - name: 16x
              value: 16
