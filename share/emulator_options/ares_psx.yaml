emulator_name: ares
core_name: psx
groups:
  GENERAL:
    submenus:
      EMULATION:
        - name: FAST BOOT
          value: ares_fast_boot
          description: Skip the boot animation of the console. Ares only applies it to the PlayStation, the Game Boy, the Game Boy Color and the Neo Geo Pocket.
          choices:
            - name: Disabled (Default)
              value: false
            - name: Enabled
              value: true
  CONTROLS:
    submenus:
      PORT 1:
        - name: CONTROLLER TYPE
          value: ares_psx_port1
          description: >-
            Controller plugged into port 1. The DualShock has analog sticks and rumble. Standard has no analog sticks: the left stick of your pad drives the D-pad, which keeps working too.
          choices:
            - name: DualShock (Default)
              value: DualShock
            - name: Standard (digital gamepad)
              value: Digital Gamepad
      PORT 2:
        - name: CONTROLLER TYPE
          value: ares_psx_port2
          description: >-
            Controller plugged into port 2. The DualShock has analog sticks and rumble. Standard has no analog sticks: the left stick of your pad drives the D-pad, which keeps working too.
          choices:
            - name: DualShock (Default)
              value: DualShock
            - name: Standard (digital gamepad)
              value: Digital Gamepad
