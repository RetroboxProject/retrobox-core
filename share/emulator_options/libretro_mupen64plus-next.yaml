emulator_name: libretro
core_name: mupen64plus_next
groups:
  GENERAL:
    submenus:
      SCREEN:
        - name: RENDERING RESOLUTION (4:3)
          value: mupen64plus-43screensize
          description: Internal render size of 4:3 games, whatever the window. Auto takes the largest that fits the screen.
          screen_auto: true
          choices:
            - name: Auto (Screen) (Default)
              value: auto
            - name: 320x240 (1x, native)
              value: 320x240
            - name: 640x480 (2x)
              value: 640x480
            - name: 960x720 (3x)
              value: 960x720
            - name: 1280x960 (4x)
              value: 1280x960
            - name: 1440x1080 (4.5x)
              value: 1440x1080
        - name: RENDERING RESOLUTION (WIDE)
          value: mupen64plus-169screensize
          description: Internal render size when widescreen is on, whatever the window. Auto takes the largest that fits the screen.
          screen_auto: true
          choices:
            - name: Auto (Screen) (Default)
              value: auto
            - name: 640x360
              value: 640x360
            - name: 960x540
              value: 960x540
            - name: 1280x720
              value: 1280x720
            - name: 1366x768
              value: 1366x768
            - name: 1920x1080
              value: 1920x1080
  CONTROLS:
    submenus:
      PORT 1:
        - name: CONTROLLER TYPE
          value: mupen64plus-controller1
          description: RetroPad keeps your pad layout; N64 maps the buttons like an N64 controller.
          core_option: false
          choices:
            - name: RetroPad (Default)
              value: retropad
            - name: N64 controller layout
              value: n64
        - name: CONTROLLER PAK
          value: mupen64plus-pak1
          description: Accessory plugged into the controller.
          choices:
            - name: Default
              value: auto
            - name: None
              value: none
            - name: Memory Pak
              value: memory
            - name: Rumble Pak
              value: rumble
            - name: Transfer Pak
              value: transfer
