emulator_name: libretro
core_name: mednafen_psx
groups:
  GENERAL:
    submenus:
      SCREEN:
        - name: INTERNAL RESOLUTION
          value: beetle_psx_hw_internal_resolution
          description: Multiplies the native PlayStation resolution. Needs a hardware renderer. Bigger is sharper and slower.
          choices:
            - name: Default
              value: auto
            - name: 1x (native)
              value: 1x(native)
            - name: 2x
              value: 2x
            - name: 4x
              value: 4x
            - name: 8x
              value: 8x
            - name: 16x
              value: 16x
  CONTROLS:
    submenus:
      PORT 1:
        - name: CONTROLLER TYPE
          value: controller1_mednafen_psx
          description: >-
            Controller plugged into port 1. Standard has no analog sticks: the left stick of your pad drives the D-pad, which keeps working too. The analog controllers read both sticks; the DualShock and the neGcon Rumble also rumble. The mouse is a real one, plugged into the computer.
          core_option: false
          choices:
            - name: Standard (Default)
              value: auto
            - name: DualShock
              value: '517'
            - name: Dual Analog
              value: '261'
            - name: Analog Joystick
              value: '773'
            - name: neGcon
              value: '1029'
            - name: neGcon Rumble
              value: '1285'
            - name: Mouse
              value: '258'
      PORT 2:
        - name: CONTROLLER TYPE
          value: controller2_mednafen_psx
          description: >-
            Controller plugged into port 2. Standard has no analog sticks: the left stick of your pad drives the D-pad, which keeps working too. The analog controllers read both sticks; the DualShock and the neGcon Rumble also rumble. The mouse is a real one, plugged into the computer.
          core_option: false
          choices:
            - name: Standard (Default)
              value: auto
            - name: DualShock
              value: '517'
            - name: Dual Analog
              value: '261'
            - name: Analog Joystick
              value: '773'
            - name: neGcon
              value: '1029'
            - name: neGcon Rumble
              value: '1285'
            - name: Mouse
              value: '258'
